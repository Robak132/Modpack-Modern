name: "Daily Dev Build"
run-name: "[📅]: Daily Dev Build #${{ github.run_number }}"

on:
  schedule:
    # 05:00 UTC ≈ 07:00 Europe/Warsaw (winter)
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if upstream/dev matches origin/daily"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-dev-build
  cancel-in-progress: true

jobs:
  sync:
    name: "[🔄] Sync upstream/dev → daily"
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      upstream_sha: ${{ steps.decide.outputs.upstream_sha }}
      version: ${{ steps.decide.outputs.version }}
      project_name: ${{ steps.decide.outputs.project_name }}
      project_full_name: ${{ steps.decide.outputs.project_full_name }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream and sync daily
        id: decide
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/TerraFirmaGreg-Team/Modpack-Modern.git
          git fetch upstream dev --tags
          git fetch origin daily || true

          UPSTREAM_SHA=$(git rev-parse upstream/dev)
          DAILY_SHA=""
          if git rev-parse --verify origin/daily >/dev/null 2>&1; then
            DAILY_SHA=$(git rev-parse origin/daily)
          fi

          VERSION="daily-$(date -u +%Y%m%d)"
          PROJECT_NAME=$(jq -r '.name' pakku.json)
          FORCE="false"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            FORCE="${{ inputs.force }}"
          fi

          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "project_name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "project_full_name=${PROJECT_NAME}-${VERSION}" >> "$GITHUB_OUTPUT"

          echo "Upstream: $UPSTREAM_SHA"
          echo "Daily:    ${DAILY_SHA:-<missing>}"
          echo "Force:    $FORCE"

          if [[ "$FORCE" != "true" && -n "$DAILY_SHA" && "$UPSTREAM_SHA" == "$DAILY_SHA" ]]; then
            echo "No upstream changes — skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git push origin "upstream/dev:refs/heads/daily" --force
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "✔️ Pushed origin/daily @ $UPSTREAM_SHA"

  build:
    name: "[📦] Build daily pack"
    needs: [sync]
    if: ${{ needs.sync.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout daily
        uses: actions/checkout@v7
        with:
          ref: daily
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Read loader / MC versions
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          MINECRAFT_VERSION=$(jq -r '.mc_versions[0]' pakku-lock.json)
          LOADER_TYPE=$(jq -r '.loaders | keys[0]' pakku-lock.json)
          LOADER_VERSION=$(jq -r --arg k "$LOADER_TYPE" '.loaders[$k]' pakku-lock.json)

          echo "minecraft_version=$MINECRAFT_VERSION" >> "$GITHUB_OUTPUT"
          echo "loader_type=$LOADER_TYPE" >> "$GITHUB_OUTPUT"
          echo "loader_version=$LOADER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp version placeholders
        shell: bash
        env:
          VERSION: ${{ needs.sync.outputs.version }}
          LOADER_VERSION: ${{ steps.meta.outputs.loader_version }}
          LOADER_TYPE: ${{ steps.meta.outputs.loader_type }}
          MINECRAFT_VERSION: ${{ steps.meta.outputs.minecraft_version }}
        run: |
          set -euo pipefail

          sed -i -e "s/DEV/${VERSION}/g" pakku.json
          sed -i -e "s/DEV/${VERSION}/g" config/mod-director/modpack.json
          sed -i -e "s/DEV/${VERSION}/g" config/fancymenu/customization/*
          sed -i -e "s/DEV/${VERSION}/g" .pakku/multimc-overrides/instance.cfg
          sed -i -e "s/DEV/${VERSION}/g" .pakku/server-overrides/server.properties
          sed -i -e "s/DEV/${VERSION}/g" .pakku/docker-overrides/docker-compose.yml

          sed -i -e "s/LOADER_VERSION/${LOADER_VERSION}/g" .pakku/multimc-overrides/mmc-pack.json
          sed -i -e "s/LOADER_VERSION/${LOADER_VERSION}/g" .pakku/server-overrides/forge-auto-install.txt
          sed -i -e "s/LOADER_VERSION/${LOADER_VERSION}/g" .pakku/docker-overrides/docker-compose.yml

          sed -i -e "s/LOADER_TYPE/${LOADER_TYPE}/g" .pakku/multimc-overrides/mmc-pack.json
          sed -i -e "s/LOADER_TYPE/${LOADER_TYPE}/g" .pakku/server-overrides/forge-auto-install.txt
          sed -i -e "s/LOADER_TYPE/${LOADER_TYPE}/g" .pakku/docker-overrides/docker-compose.yml

          sed -i -e "s/MINECRAFT_VERSION/${MINECRAFT_VERSION}/g" .pakku/multimc-overrides/mmc-pack.json
          sed -i -e "s/MINECRAFT_VERSION/${MINECRAFT_VERSION}/g" .pakku/server-overrides/forge-auto-install.txt
          sed -i -e "s/MINECRAFT_VERSION/${MINECRAFT_VERSION}/g" .pakku/docker-overrides/docker-compose.yml

          cp -vf ./config/fancymenu/assets/icons/icon64x64.png .pakku/server-overrides/server-icon.png

      - name: Cache Pakku
        uses: actions/cache@v6
        with:
          path: build/.cache
          key: pakku-cache-${{ hashFiles('pakku-lock.json') }}
          restore-keys: pakku-cache-

      - name: Cache Mods
        uses: actions/cache@v6
        with:
          path: mods
          key: mods-${{ hashFiles('pakku-lock.json') }}
          restore-keys: mods-

      - name: Fetch and export
        run: |
          set -euo pipefail
          java -jar pakku.jar fetch
          java -jar pakku.jar export
          mkdir -p .pakku/multimc-overrides/flame
          mkdir -p .pakku/multimc-overrides/mods

      - name: Prepare CurseForge artifact
        env:
          FULL_NAME: ${{ needs.sync.outputs.project_full_name }}
        run: |
          set -euo pipefail
          cd ./build/curseforge/
          mv *.zip "${FULL_NAME}-curseforge.zip"

      - name: Upload CurseForge artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.sync.outputs.project_full_name }}-curseforge
          path: ./build/curseforge/${{ needs.sync.outputs.project_full_name }}-curseforge.zip
          if-no-files-found: error

      - name: Prepare MultiMC artifact
        env:
          FULL_NAME: ${{ needs.sync.outputs.project_full_name }}
        run: |
          set -euo pipefail

          mkdir -p .pakku/multimc-overrides/flame
          mkdir -p .pakku/multimc-overrides/mods
          mv -vf .pakku/multimc-overrides ./build/multimc

          echo "Checking for mods with export: false..."
          if [ -f "./pakku.json" ]; then
            for mod in $(jq -r 'to_entries[] | select(.value.export == false) | .key' ./pakku.json); do
              echo "Looking for mod: $mod"
              find ./mods -name "${mod}*.jar" -type f -delete 2>/dev/null && echo "Deleted $mod jar files" || echo "No $mod jar files found"
            done
          fi

          cp -rf ./build/.cache/curseforge/overrides ./build/multimc/.minecraft
          cp -vf ./build/.cache/curseforge/manifest.json ./build/multimc/flame/manifest.json
          cp -vf ./config/fancymenu/assets/icons/icon128x128.png ./build/multimc/.minecraft/icon.png
          cp -rf ./mods ./build/multimc/.minecraft/

          cd ./build/multimc/
          zip -r "${FULL_NAME}-multimc.zip" icon.png mmc-pack.json instance.cfg .minecraft/ flame/

      - name: Upload MultiMC artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.sync.outputs.project_full_name }}-multimc
          path: ./build/multimc/${{ needs.sync.outputs.project_full_name }}-multimc.zip
          if-no-files-found: error

      - name: Prepare Server artifact
        env:
          FULL_NAME: ${{ needs.sync.outputs.project_full_name }}
        run: |
          set -euo pipefail
          cd ./build/serverpack/
          mv *.zip "${FULL_NAME}-serverpack.zip"

      - name: Upload Server artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ needs.sync.outputs.project_full_name }}-serverpack
          path: ./build/serverpack/${{ needs.sync.outputs.project_full_name }}-serverpack.zip
          if-no-files-found: error

  publish:
    name: "[🚀] Publish daily release"
    needs: [sync, build]
    if: ${{ needs.sync.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout for tag update
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Point daily tag at synced branch
        run: |
          set -euo pipefail
          git fetch origin daily
          git tag -f daily "origin/daily"
          git push origin refs/tags/daily --force

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          merge-multiple: true

      - name: Normalize artifact names
        env:
          FULL_NAME: ${{ needs.sync.outputs.project_full_name }}
          PROJECT_NAME: ${{ needs.sync.outputs.project_name }}
        run: |
          set -euo pipefail
          ls -lah
          test -f "${FULL_NAME}-curseforge.zip"
          test -f "${FULL_NAME}-multimc.zip"
          test -f "${FULL_NAME}-serverpack.zip"
          # Stable filenames so download URLs do not change every day
          mv "${FULL_NAME}-curseforge.zip" "${PROJECT_NAME}-daily-curseforge.zip"
          mv "${FULL_NAME}-multimc.zip" "${PROJECT_NAME}-daily-multimc.zip"
          mv "${FULL_NAME}-serverpack.zip" "${PROJECT_NAME}-daily-serverpack.zip"
          echo "✔️ All daily artifacts present"

      - name: Create / update rolling daily release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: daily
          name: Daily ${{ needs.sync.outputs.version }}
          prerelease: true
          make_latest: false
          target_commitish: daily
          body: |
            Automated daily build from upstream `dev`.

            - **Version**: `${{ needs.sync.outputs.version }}`
            - **Upstream SHA**: `${{ needs.sync.outputs.upstream_sha }}`
            - **Source**: [TerraFirmaGreg-Team/Modpack-Modern@dev](https://github.com/TerraFirmaGreg-Team/Modpack-Modern/tree/dev)

            ### Downloads
            - **MultiMC / Prism**: `${{ needs.sync.outputs.project_name }}-daily-multimc.zip`
            - **CurseForge**: `${{ needs.sync.outputs.project_name }}-daily-curseforge.zip`
            - **Server**: `${{ needs.sync.outputs.project_name }}-daily-serverpack.zip`

            Stable link: https://github.com/${{ github.repository }}/releases/tag/daily
          files: |
            ${{ needs.sync.outputs.project_name }}-daily-curseforge.zip
            ${{ needs.sync.outputs.project_name }}-daily-multimc.zip
            ${{ needs.sync.outputs.project_name }}-daily-serverpack.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
